# AS-Stats with a MariaDB database, as two containers from the same image:
#   docker compose -f docker-compose.mariadb.yml up -d
# Change the passwords below before the first start.
#
# The web container reaches MariaDB on the compose network. The collector uses
# host networking to see the routers' real addresses and reaches MariaDB on
# localhost, where it is published (127.0.0.1 only).
services:
  web:
    build: .
    image: as-stats-python:latest
    command: ["asstats", "web"]
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - asstats-data:/data
    environment:
      TZ: Europe/Vienna
      ASSTATS_DATABASE_URL: mysql+pymysql://asstats:asstats-db-password@mariadb:3306/asstats?charset=utf8mb4
      # ASSTATS_ADMIN_PASSWORD: change-me
      # ASSTATS_COOKIE_SECURE: "true"

  collector:
    build: .
    image: as-stats-python:latest
    command: ["asstats", "collector"]
    restart: unless-stopped
    network_mode: host
    depends_on:
      mariadb:
        condition: service_healthy
      web:
        condition: service_started
    volumes:
      - asstats-data:/data         # IP-to-AS table and template cache
    environment:
      TZ: Europe/Vienna
      ASSTATS_NETFLOW_PORT: "9000"
      ASSTATS_SFLOW_PORT: "6343"
      ASSTATS_DATABASE_URL: mysql+pymysql://asstats:asstats-db-password@127.0.0.1:3307/asstats?charset=utf8mb4

  mariadb:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: asstats
      MARIADB_USER: asstats
      MARIADB_PASSWORD: asstats-db-password
      MARIADB_ROOT_PASSWORD: asstats-root-password
    command: ["--innodb-buffer-pool-size=512M", "--max-connections=100"]
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  asstats-data:
  mariadb-data:
