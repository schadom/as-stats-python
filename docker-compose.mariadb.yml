# AS-Stats with a MariaDB database:
#   docker compose -f docker-compose.mariadb.yml up -d
# Change the passwords below before the first start.
# The collector uses host networking to see the routers' real addresses, so
# MariaDB is published on localhost only.
services:
  asstats:
    build: .
    image: as-stats-python:latest
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    network_mode: host
    volumes:
      - asstats-data:/data
    environment:
      TZ: Europe/Vienna
      ASSTATS_WEB_PORT: "8080"
      ASSTATS_NETFLOW_PORT: "9000"
      ASSTATS_SFLOW_PORT: "6343"
      ASSTATS_DATABASE_URL: mysql+pymysql://asstats:asstats-db-password@127.0.0.1:3307/asstats?charset=utf8mb4
      # ASSTATS_ADMIN_PASSWORD: change-me

  mariadb:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: asstats
      MARIADB_USER: asstats
      MARIADB_PASSWORD: asstats-db-password
      MARIADB_ROOT_PASSWORD: asstats-root-password
    command: ["--innodb-buffer-pool-size=512M", "--max-connections=100"]
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  asstats-data:
  mariadb-data:
