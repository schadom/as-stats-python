[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asstats"
dynamic = ["version"]
description = "Per-AS traffic statistics from NetFlow/IPFIX/sFlow, a Python take on AS-Stats"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0.25",
    "pymysql>=1.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
asstats = "asstats.cli:main"

[tool.setuptools.dynamic]
# The version lives only in asstats/__init__.py.
version = { attr = "asstats.__version__" }

[tool.setuptools.packages.find]
include = ["asstats*"]

[tool.setuptools.package-data]
asstats = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
